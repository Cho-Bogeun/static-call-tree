[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cstat"
version = "0.1.0"
description = "레거시 C 코드베이스의 정적 콜트리를 뽑고(libclang) 숨은 상태로 인한 오염을 판정한다"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# 바인딩만 선언한다. 네이티브 .so 는 시스템 것을 쓰고 CALLTREE_LIBCLANG_LIBRARY 로
# 가리킨다.
#
# PyPI `libclang` 휠을 기본으로 두지 않는 이유: 그 휠은 libclang.so 만 담고 clang
# 리소스 디렉터리(빌트인 헤더)를 담지 않는다. 그러면 stddef.h 를 못 찾아 NULL 이
# 미정의 식별자가 되고, clang 의 에러 복구가 그 식별자를 쓰는 호출식을 AST 에서
# 통째로 지운다. 결과는 종료 코드 0 으로 나오는 **잘린 콜트리**다 (같은 진입점에서
# 도달 정의 197 -> 176 을 실측했다).
dependencies = ["clang>=16"]

[project.optional-dependencies]
validate = ["jsonschema>=4"]
dev = ["jsonschema>=4", "pytest>=7"]
# 시스템 libclang 을 깔 수 없는 환경용. 빌트인 헤더가 없으므로 -resource-dir 을 따로
# 주지 않으면 위의 절단이 일어난다. 그때는 preflight 가 잡고 멈춘다.
#
# `clang` 과 `libclang` 은 같은 clang/ 디렉터리를 덮어쓰므로 공존할 수 없다.
# 이쪽을 쓰려면 먼저 `pip uninstall -y clang` 해야 한다.
bundled-libclang = ["libclang>=16"]

[project.scripts]
cstat = "cstat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# 그림의 뼈대(HTML/CSS/JS)는 파이썬 문자열이 아니라 진짜 파일로 둔다. 휠에도
# 같이 실려야 `cstat visualize` 가 어디서든 돈다.
[tool.setuptools.package-data]
visualize = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
