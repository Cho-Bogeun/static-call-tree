[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cstat"
version = "0.1.0"
description = "레거시 C 코드베이스의 정적 콜트리를 뽑고(libclang) 숨은 상태로 인한 오염을 판정한다"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# 시스템에 설치된 libclang 을 쓰고 싶으면 이 의존성을 빼고
# CALLTREE_LIBCLANG_LIBRARY 로 .so 경로를 지정하면 된다.
dependencies = ["libclang>=16"]

[project.optional-dependencies]
validate = ["jsonschema>=4"]
dev = ["jsonschema>=4", "pytest>=7"]

[project.scripts]
cstat = "cstat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# 그림의 뼈대(HTML/CSS/JS)는 파이썬 문자열이 아니라 진짜 파일로 둔다. 휠에도
# 같이 실려야 `cstat visualize` 가 어디서든 돈다.
[tool.setuptools.package-data]
visualize = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
